[workspace]
members = [
    # The Rust kernel: canvas, input, registry, lifecycle, wasmi host.
    "fri3d-kernel",
    # App SDK — the 24-function host ABI that every app compiles against.
    "fri3d-wasm-api",
    # Apps — all compile to wasm32-unknown-unknown. Each folder holds the
    # crate, a manifest.toml and an icon.png; tools/fri3d-pack bundles them.
    "apps/circles",
    "apps/dots",
    "apps/launcher",
    "apps/mandelbrot",
    "apps/settings",
    "apps/snake",
    "apps/speedtest",
    "apps/test_drawing",
    "apps/test_ui",
    "apps/wifi_pet",
    # Embedded bundles (generated.rs written by fri3d-pack).
    "fri3d-apps",
    # System icons (generated.rs written by fri3d-pack from artwork/icons).
    "fri3d-artwork",
    # Hosts: same kernel, different IO.
    "hosts/desktop",
    "hosts/web",
    # Bundler: manifest.toml + icon.png + wasm -> .fab
    "tools/fri3d-pack",
    # Font tables: artwork/fonts/*.bdf -> fri3d-kernel/src/fonts.rs
    "tools/fri3d-fontgen",
]
default-members = [
    "fri3d-kernel",
    "fri3d-wasm-api",
]
# The badge firmware targets xtensa with the `esp` toolchain; it is its own
# workspace (see hosts/badge/Cargo.toml) and depends on our crates by path.
exclude = ["hosts/badge"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1

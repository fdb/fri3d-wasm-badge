[package]
name = "fri3d-host-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Desktop host: the kernel in a minifb window. Also a headless screenshot tool."

[[bin]]
name = "fri3d"
path = "src/main.rs"

[dependencies]
fri3d-kernel = { path = "../../fri3d-kernel", features = ["std"] }
fri3d-apps = { path = "../../fri3d-apps" }
minifb = { version = "0.28", default-features = false }

# Linux needs a windowing backend; x11-dl loads libX11 at runtime, so CI
# compiles without X headers.
[target.'cfg(target_os = "linux")'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"] }
png = "0.17"
